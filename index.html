<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }

    header, footer {
      background: #111;
      color: #fff;
      padding: 1rem 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    section {
      margin-bottom: 2rem;
    }

    footer {
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>Home</h2>
      <p>Welcome to my website.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Write something about yourself or your project here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>email@example.com</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

  <script>
    console.log("Website loaded.");
  </script>
</body>
</html>
